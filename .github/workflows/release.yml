name: Release

# 发布流水线：先完整执行质量门禁，门禁通过后才创建 GitHub Release。
# release job 通过 needs: quality-gate 与 reusable workflow 的硬性结果绑定，
# 依赖安装、迁移、类型、测试、构建任一失败都不会产生发布。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本标签（需已存在，例如 v1.2.3）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Quality Gate (install · migrate · typecheck · test · build)
    uses: ./.github/workflows/quality-gate.yml
    secrets: inherit

  release:
    name: Publish GitHub Release
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 门禁未通过时 release 处于 skipped/failed，绝不会执行发布动作
    environment:
      name: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 手动触发时检出输入标签；标签推送时检出推送的标签
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::标签 $tag 不存在，无法发布"
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.tag.outputs.value }}' \
            --title '${{ steps.tag.outputs.value }}' \
            --generate-notes \
            --verify-tag
